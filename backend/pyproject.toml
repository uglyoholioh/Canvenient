[project]
name = "canvenient-backend"
version = "0.1.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
extend-exclude = ["venv", "build", "dist", ".pytest_cache"]

[tool.ruff.lint]
# Defaults (E4/E7/E9/F) plus import sorting and upgradeable pyflakes.
select = ["E4", "E7", "E9", "F", "I", "B"]
# B008: FastAPI dependency injection relies on function calls in defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# conftest must set env/sys.path before app imports; the skipped canvas_search
# test imports after its module-level skip.
"tests/conftest.py" = ["E402"]
"tests/test_canvas_resource_search.py" = ["E402"]
# The migration-failure test accepts any database driver error type.
"tests/test_migrations.py" = ["B017"]
