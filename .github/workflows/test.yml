name: CanVenient CI Pipeline

# Run on every branch push (all real work happens on feature branches) and on
# PRs targeting the mainline.
on:
  push:
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-lock.txt
          pip install -r backend/requirements-test.txt

      - name: Lint backend (ruff)
        run: |
          cd backend
          ruff check .

      - name: Run Pytest suite
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          JWT_SECRET: orbital-milestone-3-ci-secret
        run: |
          cd backend
          pytest tests/ -v

  frontend-tests:
    name: Frontend Lint + Vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Run ESLint (errors fail the build)
        run: |
          cd frontend
          npm run lint

      - name: Run Vitest suite
        run: |
          cd frontend
          npm run test

  macos-compile:
    # The packaged macOS app is the product's only ship path; compile the
    # frontend bundle and the Tauri/Rust shell so packaging breakage is caught
    # before a local rebuild. Runs on mainline pushes and PRs only — macOS
    # runners bill at 10x, so feature-branch pushes use the fast Linux job.
    name: macOS Compile (Vite + Tauri)
    runs-on: macos-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend bundle
        run: |
          cd frontend
          npm run build

      - name: Compile Tauri shell
        run: |
          cd frontend/src-tauri
          cargo check
